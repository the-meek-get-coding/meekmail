name: Trigger Amplify Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Amplify webhook
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          test -n "$AMPLIFY_WEBHOOK_URL"
          curl --fail --show-error --silent --request POST "$AMPLIFY_WEBHOOK_URL"
